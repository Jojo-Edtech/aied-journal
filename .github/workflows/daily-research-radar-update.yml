name: Daily AIED Research Radar Update

on:
  schedule:
    # 22:00 UTC = 06:00 Hong Kong / Beijing time.
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily-research-radar-update.yml'
      - 'scripts/generate-research-radar.py'
      - 'scripts/radar_pipeline.py'
      - 'scripts/test_radar_pipeline.py'
      - 'scripts/journal_scope.py'
      - 'scripts/test_journal_scope.py'
      - 'scripts/build-index-evidence.py'
      - 'scripts/validate-data.mjs'
      - 'data/radar/source_workbook_snapshot.json'
      - 'data/catalog/**'
      - 'package.json'

permissions: {}

concurrency:
  group: research-radar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-radar:
    name: Refresh research radar data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # Required to commit regenerated public radar data back to main.
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    env:
      TZ: Asia/Hong_Kong
      RADAR_CRAWL_JOURNAL_LIMIT: ${{ vars.RADAR_CRAWL_JOURNAL_LIMIT || '80' }}
      RADAR_ARTICLE_JOURNAL_LIMIT: ${{ vars.RADAR_ARTICLE_JOURNAL_LIMIT || '500' }}
      RADAR_MAX_PAGES_PER_JOURNAL: ${{ vars.RADAR_MAX_PAGES_PER_JOURNAL || '1' }}
      RADAR_MAX_ARTICLES_PER_JOURNAL: ${{ vars.RADAR_MAX_ARTICLES_PER_JOURNAL || '40' }}
      RADAR_MAX_OFFICIAL_ARTICLES: ${{ vars.RADAR_MAX_OFFICIAL_ARTICLES || '0' }}
      RADAR_WORKERS: ${{ vars.RADAR_WORKERS || '4' }}
      RADAR_TIME_BUDGET_SECONDS: ${{ vars.RADAR_TIME_BUDGET_SECONDS || '1800' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install radar data dependencies
        run: python -m pip install --upgrade pandas openpyxl

      - name: Test pipeline without network requests
        run: |
          npm run check:scope
          python -m unittest discover -s scripts -p 'test_radar_pipeline.py'

      - name: Refresh radar data
        run: |
          set -euo pipefail
          CROSSREF_FROM_DATE=$(date -d '5 years ago' +%Y-%m-%d)
          echo "Refreshing rotating batches across the full catalog using persisted cursors."
          python scripts/generate-research-radar.py \
            --max-pages-per-journal "$RADAR_MAX_PAGES_PER_JOURNAL" \
            --max-crossref-articles "$RADAR_MAX_ARTICLES_PER_JOURNAL" \
            --max-official-articles "$RADAR_MAX_OFFICIAL_ARTICLES" \
            --article-journal-limit "$RADAR_ARTICLE_JOURNAL_LIMIT" \
            --crawl-journal-limit "$RADAR_CRAWL_JOURNAL_LIMIT" \
            --workers "$RADAR_WORKERS" \
            --time-budget-seconds "$RADAR_TIME_BUDGET_SECONDS" \
            --crossref-from-pub-date "$CROSSREF_FROM_DATE" \
            --timeout 8

      - name: Validate data
        run: npm run validate:data

      - name: Summarize refresh
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('data/radar/crawl_report.json', 'utf8'));
          const coverage = report.preference_coverage || {};
          const policy = report.refresh_policy || {};
          const lines = [
            '## AIED Journal Radar daily refresh',
            '',
            `- Generated: ${report.generated_at || 'unknown'}`,
            `- Journals: ${report.journal_count || 0}`,
            `- Article samples: ${report.articles?.total || 0}`,
            `- Article refreshes: ${policy.article_updated || 0} updated, ${policy.article_failed || 0} failed, ${policy.article_budget_deferred || 0} deferred by budget`,
            `- Journals retaining previous samples: ${policy.article_retained_journals || 0}`,
            `- Next Crossref cursor: ${policy.article_next_offset || 0}`,
            `- Journals with latest-issue samples: ${coverage.journals_with_latest_issue || 0}/${coverage.total || 0}`,
            `- Official pages refreshed today: ${policy.official_page_batch_size || 0}`,
            `- RAG documents: ${report.rag_documents || 0}`,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Commit radar data changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/radar; then
            echo "No radar data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/radar
            git commit -m "Refresh AIED research radar data"
            gh auth setup-git
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    if: ${{ needs.refresh-radar.outputs.changed == 'true' }}
    needs: refresh-radar
    permissions:
      contents: read
      pages: write      # Required by the reusable GitHub Pages deployment workflow.
      id-token: write   # Required for GitHub Pages OIDC authentication.
    uses: ./.github/workflows/deploy-pages.yml
