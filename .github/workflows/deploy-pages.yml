name: Deploy AIED Journal Radar

on:
  workflow_call:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Audit and test the API
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r research_radar_api/requirements.lock.txt
          python -m pip install --disable-pip-version-check \
            pip-audit==2.10.1
          python -m pip_audit -r research_radar_api/requirements.lock.txt
          python -m unittest research_radar_api/test_security.py
          node --test journal_worker/index.test.mjs

      - name: Validate radar data
        run: npm run validate:data

      - name: Build static site
        run: npm run build:static

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    permissions:
      pages: write     # Required to publish the prepared Pages artifact.
      id-token: write  # Required for GitHub Pages OIDC authentication.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
